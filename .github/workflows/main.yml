name: Build Android APK

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 3 -type f | sort

          echo "===== BUILDOZER SPEC ====="
          if [ -f buildozer.spec ]; then
            echo "FOUND: buildozer.spec"
          else
            echo "ERROR: buildozer.spec NOT FOUND"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Verify Buildozer
        run: |
          buildozer --version
          ls -la
          test -f buildozer.spec
          test -f main.py

      - name: Build APK
        run: |
          buildozer android debug

      - name: Show APK files
        if: always()
        run: |
          find bin -type f -maxdepth 2 -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouDownloader-APK
          path: bin/*.apk
          if-no-files-found: error
